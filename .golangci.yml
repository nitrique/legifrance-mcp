version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - noctx
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, unparam]

formatters:
  enable:
    - gofmt
    - goimports
