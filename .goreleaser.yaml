# Configuration GoReleaser : binaires du serveur MCP pour les plateformes cibles.
# Documentation : https://goreleaser.com
version: 2

project_name: legifrance-mcp

before:
  hooks:
    - go mod download

builds:
  - id: legifrance-mcp
    main: ./cmd/legifrance-mcp
    binary: legifrance-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Cibles : Windows amd64, macOS Apple Silicon, Linux amd64 et arm64.
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next+{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
